<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>长信宫灯 3D 拆解展示</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(20, 23, 25, 0.78);
      --panel-strong: rgba(18, 20, 22, 0.92);
      --text: #f5efe4;
      --muted: #c9bca7;
      --accent: #d7aa5f;
      --accent-2: #77b6a6;
      --line: rgba(255, 255, 255, 0.14);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 18%, rgba(215, 170, 95, 0.18), transparent 28%),
        linear-gradient(140deg, #101517 0%, #1e231f 46%, #0d1012 100%);
      color: var(--text);
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
    }

    #viewer {
      position: relative;
      min-width: 0;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .topbar {
      position: absolute;
      left: 28px;
      right: 28px;
      top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      pointer-events: none;
      z-index: 3;
    }

    .title-block {
      min-width: 240px;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.44);
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 42px);
      line-height: 1.08;
      letter-spacing: 0;
      font-weight: 760;
    }

    .title-block p {
      width: min(560px, 52vw);
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    button {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 15px;
      background: rgba(25, 29, 28, 0.72);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    button:hover {
      border-color: rgba(215, 170, 95, 0.7);
      background: rgba(50, 45, 34, 0.76);
      transform: translateY(-1px);
    }

    button.primary {
      border-color: rgba(215, 170, 95, 0.72);
      background: linear-gradient(180deg, rgba(176, 118, 45, 0.94), rgba(116, 78, 35, 0.92));
      color: #fff8ea;
    }

    button.active {
      border-color: rgba(119, 182, 166, 0.82);
      background: linear-gradient(180deg, rgba(72, 128, 119, 0.9), rgba(36, 78, 72, 0.88));
      color: #f4fffb;
    }

    .hint {
      position: absolute;
      left: 28px;
      bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      z-index: 3;
      max-width: min(720px, calc(100vw - 420px));
      pointer-events: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #efe5d2;
      background: rgba(17, 20, 20, 0.62);
      backdrop-filter: blur(14px);
      font-size: 13px;
      line-height: 1.35;
    }

    .status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 5;
      background: rgba(8, 10, 11, 0.72);
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .status.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader {
      width: min(360px, calc(100vw - 44px));
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .loader-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 680;
    }

    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress span {
      display: block;
      width: 12%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      animation: loading 1.15s ease-in-out infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(840%); }
    }

    aside {
      position: relative;
      height: 100vh;
      overflow: auto;
      border-left: 1px solid var(--line);
      background: rgba(13, 16, 16, 0.86);
      backdrop-filter: blur(18px);
      z-index: 4;
    }

    .panel {
      padding: 24px;
    }

    .panel-label {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0;
    }

    .panel h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .panel .lead {
      margin: 14px 0 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .part-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.055);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    }

    .part-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: contain;
      padding: 16px;
      background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03) 58%);
    }

    .part-body {
      padding: 18px;
      border-top: 1px solid var(--line);
    }

    .part-body h3 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .part-body p {
      margin: 0;
      color: #dfd4c3;
      font-size: 14px;
      line-height: 1.78;
    }

    .part-list {
      margin-top: 22px;
      display: grid;
      gap: 8px;
    }

    .part-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.055);
      color: #e8ddcc;
      font-size: 14px;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .part-pill:hover,
    .part-pill.active {
      border-color: rgba(215, 170, 95, 0.62);
      background: rgba(215, 170, 95, 0.13);
    }

    .part-pill span:last-child {
      color: var(--accent);
      font-size: 12px;
    }

    .empty-state {
      min-height: 220px;
      display: grid;
      align-content: center;
      gap: 12px;
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 22px;
      color: var(--muted);
      line-height: 1.7;
    }

    .empty-state strong {
      color: var(--text);
      font-size: 18px;
    }

    @media (max-width: 900px) {
      #app {
        grid-template-columns: 1fr;
      }

      aside {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        height: auto;
        max-height: 42vh;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .panel {
        padding: 16px;
      }

      .panel h2 {
        font-size: 22px;
      }

      .topbar {
        left: 16px;
        right: 16px;
        top: 14px;
        align-items: flex-start;
      }

      .title-block p {
        width: min(560px, 72vw);
        font-size: 13px;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 88px;
        padding: 0 8px;
      }

      .hint {
        left: 16px;
        right: 16px;
        bottom: calc(42vh + 24px);
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="viewer" aria-label="长信宫灯三维展示区">
      <div class="topbar">
        <div class="title-block">
          <h1>长信宫灯</h1>
          <p>拖拽旋转，滚轮缩放。点击模型进入拆解状态，再点击构件查看名称与功能。</p>
        </div>
        <div class="toolbar">
          <button id="toggleBtn" class="primary" type="button">拆解</button>
          <button id="smokeBtn" type="button">烟路</button>
          <button id="resetBtn" type="button">复位</button>
        </div>
      </div>

      <div class="hint">
        <span class="chip" id="modeChip">当前：整体展示</span>
        <span class="chip">鼠标左键拖拽旋转</span>
        <span class="chip">滚轮缩放</span>
      </div>

      <div class="status" id="status">
        <div class="loader">
          <p class="loader-title" id="loaderText">正在读取本地 GLB 模型</p>
          <div class="progress"><span></span></div>
        </div>
      </div>
    </section>

    <aside>
      <div class="panel">
        <p class="panel-label">构件信息</p>
        <h2 id="panelTitle">点击构件查看介绍</h2>
        <p class="lead" id="panelLead">进入拆解状态后，模型会按主要结构分离。选择右侧列表或直接点击 3D 构件，都可以查看说明。</p>

        <div id="partInfo" class="empty-state">
          <strong>尚未选择构件</strong>
          <span>点击“拆解”或直接点击模型，然后选择头部、灯罩、灯盘、烟道弯管、身躯、灯座等部分。</span>
        </div>

        <div class="part-list" id="partList"></div>
      </div>
    </aside>
  </main>

  <script src="./model-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    const partMeta = {
      head: {
        name: "头部",
        image: "头部 17.08.05.png",
        role: "人物头部与面部细节强化了宫女跪坐持灯的形象，使器物在照明功能之外兼具叙事性和礼仪感。"
      },
      shade: {
        name: "灯罩",
        image: "灯罩.png",
        role: "灯罩用于遮挡和调节光线，也承担聚光与防风作用，是长信宫灯实现可控照明的重要构件。"
      },
      pan: {
        name: "灯盘",
        image: "灯盘.png",
        role: "灯盘承托灯火与燃料，配合灯罩形成稳定的照明核心，并便于拆卸清理。"
      },
      pipe: {
        name: "烟道弯管",
        image: "右臂.png",
        role: "弯管结构用于引导灯烟进入人物体腔，帮助减少室内烟尘，是长信宫灯环保设计中最关键的功能构件之一。"
      },
      body: {
        name: "身躯",
        image: "身躯.png",
        role: "身躯是人物造型和内部烟道系统的主体。灯烟经弯管进入中空体腔，在内部冷却、沉降并被吸附，体现了长信宫灯将造型、承重与烟气净化结合的设计。"
      },
      base: {
        name: "灯座",
        image: "灯座.png",
        role: "灯座提供稳定支撑，保证整件灯具在使用和陈设中的重心平衡。"
      }
    };

    const partOrder = ["head", "shade", "pan", "pipe", "body", "base"];
    const partSources = {
      head: "./part-data/head.js",
      shade: "./part-data/shade.js",
      pan: "./part-data/pan.js",
      pipe: "./part-data/pipe.js",
      body: "./part-data/body.js",
      base: "./part-data/base.js"
    };
    const partLayout = {
      head: { position: new THREE.Vector3(-0.64, 0.56, -0.05), rotation: new THREE.Euler(0, -0.08, 0), size: 0.58 },
      shade: { position: new THREE.Vector3(0.64, 0.56, -0.05), rotation: new THREE.Euler(0, -0.18, 0), size: 0.62 },
      pan: { position: new THREE.Vector3(0.72, -0.10, 0.06), rotation: new THREE.Euler(0, 0.08, 0), size: 0.56 },
      pipe: { position: new THREE.Vector3(-0.72, -0.10, 0.04), rotation: new THREE.Euler(0, 0.16, 0), size: 0.54 },
      body: { position: new THREE.Vector3(0, -0.06, -0.02), rotation: new THREE.Euler(0, 0, 0), size: 0.82 },
      base: { position: new THREE.Vector3(0, -0.82, 0), rotation: new THREE.Euler(0, 0, 0), size: 0.68 }
    };

    const viewer = document.getElementById("viewer");
    const statusEl = document.getElementById("status");
    const loaderText = document.getElementById("loaderText");
    const toggleBtn = document.getElementById("toggleBtn");
    const smokeBtn = document.getElementById("smokeBtn");
    const resetBtn = document.getElementById("resetBtn");
    const modeChip = document.getElementById("modeChip");
    const partInfo = document.getElementById("partInfo");
    const partList = document.getElementById("partList");
    const panelTitle = document.getElementById("panelTitle");
    const panelLead = document.getElementById("panelLead");

    const scene = new THREE.Scene();
    scene.background = null;
    scene.fog = new THREE.Fog(0x101517, 5, 9);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 100);
    camera.position.set(0.2, 1.35, 5.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.physicallyCorrectLights = true;
    renderer.localClippingEnabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    viewer.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.8;
    controls.maxDistance = 7.8;
    controls.target.set(0, 0.25, 0);

    const hemi = new THREE.HemisphereLight(0xfff2dd, 0x263233, 1.7);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xffe1ad, 3.2);
    keyLight.position.set(3.4, 4.8, 3.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x87c7bd, 1.2);
    fillLight.position.set(-3.8, 2.2, -2.8);
    scene.add(fillLight);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(2.8, 96),
      new THREE.MeshStandardMaterial({
        color: 0x1c201d,
        roughness: 0.82,
        metalness: 0.08,
        transparent: true,
        opacity: 0.72
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.22;
    floor.receiveShadow = true;
    scene.add(floor);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const clickStart = new THREE.Vector2();

    let assembledRoot;
    let explodedRoot;
    let exploded = false;
    let selectedPart = null;
    let normalizedScale = 1;
    let rawSize = new THREE.Vector3(1, 1, 1);
    let clickReady = false;
    let pickTargets = [];
    let partsLoaded = false;
    let partsLoading = false;
    let smokeActive = false;
    let smokeGroup;
    let smokeCurve;
    let smokePathMesh;
    let smokeParticles = [];
    const smokeClock = new THREE.Clock();

    function makeSmokeTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 96;
      canvas.height = 96;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createRadialGradient(48, 48, 4, 48, 48, 46);
      gradient.addColorStop(0, "rgba(255, 255, 255, 0.72)");
      gradient.addColorStop(0.42, "rgba(222, 232, 220, 0.34)");
      gradient.addColorStop(1, "rgba(222, 232, 220, 0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 96, 96);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function getSmokePoints() {
      if (exploded) {
        return [
          new THREE.Vector3(0.72, 0.02, 0.30),
          new THREE.Vector3(0.44, -0.04, 0.32),
          new THREE.Vector3(0.02, -0.08, 0.30),
          new THREE.Vector3(-0.62, -0.10, 0.27),
          new THREE.Vector3(-0.42, -0.18, 0.24),
          new THREE.Vector3(-0.08, -0.20, 0.20),
          new THREE.Vector3(0, -0.48, 0.18),
          new THREE.Vector3(0, -0.82, 0.16)
        ];
      }

      return [
        new THREE.Vector3(0.58, 0.36, 0.30),
        new THREE.Vector3(0.42, 0.28, 0.27),
        new THREE.Vector3(0.22, 0.12, 0.24),
        new THREE.Vector3(0.02, -0.16, 0.20),
        new THREE.Vector3(-0.08, -0.48, 0.18),
        new THREE.Vector3(-0.02, -0.82, 0.18),
        new THREE.Vector3(0.08, -1.04, 0.16)
      ];
    }

    function rebuildSmokePath() {
      if (!smokeGroup) return;

      if (smokePathMesh) {
        smokeGroup.remove(smokePathMesh);
        smokePathMesh.geometry.dispose();
        smokePathMesh.material.dispose();
      }

      smokeCurve = new THREE.CatmullRomCurve3(getSmokePoints());
      const tube = new THREE.TubeGeometry(smokeCurve, 96, 0.012, 8, false);
      const material = new THREE.MeshBasicMaterial({
        color: 0xcfe8df,
        transparent: true,
        opacity: 0.28,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      smokePathMesh = new THREE.Mesh(tube, material);
      smokePathMesh.renderOrder = 20;
      smokeGroup.add(smokePathMesh);
    }

    function createSmokeFlow() {
      smokeGroup = new THREE.Group();
      smokeGroup.name = "烟路流动演示";
      smokeGroup.visible = false;
      scene.add(smokeGroup);

      const texture = makeSmokeTexture();
      for (let i = 0; i < 34; i += 1) {
        const material = new THREE.SpriteMaterial({
          map: texture,
          color: i % 3 === 0 ? 0xffedd0 : 0xe9f3ee,
          transparent: true,
          opacity: 0.46,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        const sprite = new THREE.Sprite(material);
        sprite.userData.offset = i / 34;
        sprite.userData.speed = 0.045 + (i % 7) * 0.004;
        sprite.userData.drift = (i % 5) * 0.17;
        smokeGroup.add(sprite);
        smokeParticles.push(sprite);
      }

      rebuildSmokePath();
    }

    function setSmokeActive(next) {
      smokeActive = next;
      if (!smokeGroup) createSmokeFlow();
      smokeGroup.visible = smokeActive;
      smokeBtn.classList.toggle("active", smokeActive);
      smokeBtn.textContent = smokeActive ? "烟路开" : "烟路";
      if (smokeActive) rebuildSmokePath();
    }

    function updateSmokeFlow() {
      if (!smokeActive || !smokeCurve) return;

      const elapsed = smokeClock.getElapsedTime();
      smokeParticles.forEach((sprite, index) => {
        const t = (sprite.userData.offset + elapsed * sprite.userData.speed) % 1;
        const point = smokeCurve.getPointAt(t);
        const wave = Math.sin(elapsed * 2.1 + sprite.userData.drift + index * 0.27) * 0.024;
        const lift = Math.sin(t * Math.PI) * 0.035;
        sprite.position.set(point.x + wave, point.y + lift, point.z + wave * 0.45);

        const size = 0.082 + Math.sin(t * Math.PI) * 0.06;
        sprite.scale.setScalar(size);
        sprite.material.opacity = 0.10 + Math.sin(t * Math.PI) * 0.46;
      });
    }

    function buildPartButtons() {
      partList.innerHTML = "";
      partOrder.forEach((partId) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "part-pill";
        button.dataset.part = partId;
        button.innerHTML = `<span>${partMeta[partId].name}</span><span>查看</span>`;
        button.addEventListener("click", async () => {
          if (!exploded) await setExploded(true);
          selectPart(partId);
        });
        partList.appendChild(button);
      });
    }

    function updatePartButtons() {
      document.querySelectorAll(".part-pill").forEach((button) => {
        button.classList.toggle("active", button.dataset.part === selectedPart);
      });
    }

    function showEmptyInfo() {
      panelTitle.textContent = "点击构件查看介绍";
      panelLead.textContent = "进入拆解状态后，模型会按主要结构分离。选择右侧列表或直接点击 3D 构件，都可以查看说明。";
      partInfo.className = "empty-state";
      partInfo.innerHTML = "<strong>尚未选择构件</strong><span>点击“拆解”或直接点击模型，然后选择头部、灯罩、灯盘、烟道弯管、身躯、灯座等部分。</span>";
      selectedPart = null;
      updatePartButtons();
    }

    function selectPart(partId) {
      const meta = partMeta[partId];
      if (!meta) return;

      selectedPart = partId;
      panelTitle.textContent = meta.name;
      panelLead.textContent = "已选中构件";
      partInfo.className = "part-card";
      partInfo.innerHTML = `
        <img src="${meta.image}" alt="${meta.name}">
        <div class="part-body">
          <h3>${meta.name}</h3>
          <p>${meta.role}</p>
        </div>
      `;
      updatePartButtons();

      if (!explodedRoot) return;
      explodedRoot.traverse((object) => {
        if (!object.isMesh || !object.userData.partId) return;
        const active = object.userData.partId === partId;
        object.material.emissive = object.material.emissive || new THREE.Color(0x000000);
        object.material.emissive.setHex(active ? 0x3b2a13 : 0x000000);
        object.material.emissiveIntensity = active ? 0.35 : 0;
      });
    }

    function decodeBase64ToArrayBuffer(base64) {
      loaderText.textContent = "正在解析模型数据";
      const clean = base64.replace(/\s/g, "");
      const binary = atob(clean);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      const chunk = 65536;

      for (let offset = 0; offset < len; offset += chunk) {
        const end = Math.min(offset + chunk, len);
        for (let i = offset; i < end; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
      }
      return bytes.buffer;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[data-part-src="${src}"]`);
        if (existing) {
          resolve();
          return;
        }

        const script = document.createElement("script");
        script.src = src;
        script.dataset.partSrc = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`无法加载 ${src}`));
        document.body.appendChild(script);
      });
    }

    function parseGlb(base64) {
      return new Promise((resolve, reject) => {
        const loader = new THREE.GLTFLoader();
        loader.parse(
          decodeBase64ToArrayBuffer(base64),
          "",
          resolve,
          reject
        );
      });
    }

    function prepareObjectForPart(root, partId) {
      root.traverse((object) => {
        if (!object.isMesh) return;
        object.castShadow = true;
        object.receiveShadow = true;
        object.userData.partId = partId;

        const sourceMaterial = Array.isArray(object.material) ? object.material[0] : object.material;
        object.material = sourceMaterial.clone();
        object.material.side = THREE.DoubleSide;
        object.material.emissive = object.material.emissive || new THREE.Color(0x000000);
        object.material.emissiveIntensity = 0;
      });
    }

    function normalizePart(root, targetSize) {
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const scale = targetSize / Math.max(size.x, size.y, size.z);

      root.position.sub(center);
      root.scale.setScalar(scale);
      root.updateMatrixWorld(true);

      const normalizedBox = new THREE.Box3().setFromObject(root);
      const normalizedCenter = normalizedBox.getCenter(new THREE.Vector3());
      root.position.sub(normalizedCenter);
      return normalizedBox.getSize(new THREE.Vector3());
    }

    function addPickProxy(group, partId, size) {
      const proxy = new THREE.Mesh(
        new THREE.BoxGeometry(size.x * 1.06, size.y * 1.06, size.z * 1.06),
        new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.001,
          depthWrite: false
        })
      );
      proxy.name = `${partMeta[partId].name}拾取区`;
      proxy.userData.partId = partId;
      proxy.renderOrder = 10;
      group.add(proxy);
      pickTargets.push(proxy);
    }

    async function ensureExplodedParts() {
      if (partsLoaded) return true;
      if (partsLoading) return false;

      partsLoading = true;
      statusEl.classList.remove("hidden");
      loaderText.textContent = "正在加载真实拆解构件";

      try {
        explodedRoot = new THREE.Group();
        explodedRoot.visible = false;
        pickTargets = [];

        for (const partId of partOrder) {
          loaderText.textContent = `正在加载${partMeta[partId].name}模型`;
          await loadScript(partSources[partId]);

          const base64 = window.CHANGXIN_PARTS_BASE64 && window.CHANGXIN_PARTS_BASE64[partId];
          if (!base64) {
            throw new Error(`缺少${partMeta[partId].name}模型数据`);
          }

          const gltf = await parseGlb(base64);
          const root = gltf.scene;
          const group = new THREE.Group();
          const layout = partLayout[partId];

          group.name = partMeta[partId].name;
          group.userData.partId = partId;
          group.userData.target = layout.position.clone();
          group.userData.rest = new THREE.Vector3();

          prepareObjectForPart(root, partId);
          const size = normalizePart(root, layout.size);
          root.rotation.copy(layout.rotation);
          group.add(root);
          addPickProxy(group, partId, size);
          explodedRoot.add(group);
        }

        scene.add(explodedRoot);
        partsLoaded = true;
        return true;
      } catch (error) {
        console.error(error);
        loaderText.textContent = "拆解构件加载失败，请检查 part-data 文件是否完整";
        return false;
      } finally {
        partsLoading = false;
        if (partsLoaded) statusEl.classList.add("hidden");
      }
    }

    function prepareModel(gltf) {
      loaderText.textContent = "正在准备整体展示";
      assembledRoot = gltf.scene;
      assembledRoot.traverse((object) => {
        if (!object.isMesh) return;
        object.castShadow = true;
        object.receiveShadow = true;
        if (object.material) {
          object.material.side = THREE.DoubleSide;
          object.material.roughness = Math.max(object.material.roughness || 0.4, 0.58);
          object.material.metalness = Math.max(object.material.metalness || 0, 0.08);
        }
      });

      assembledRoot.updateMatrixWorld(true);
      const rawBox = new THREE.Box3().setFromObject(assembledRoot);
      const rawCenter = rawBox.getCenter(new THREE.Vector3());
      rawSize = rawBox.getSize(new THREE.Vector3());
      normalizedScale = 2.55 / Math.max(rawSize.x, rawSize.y, rawSize.z);

      assembledRoot.position.set(
        -rawCenter.x * normalizedScale,
        -rawCenter.y * normalizedScale,
        -rawCenter.z * normalizedScale
      );
      assembledRoot.scale.setScalar(normalizedScale);
      scene.add(assembledRoot);

      clickReady = true;
      statusEl.classList.add("hidden");
      fitCameraToModel();
    }

    function fitCameraToModel() {
      controls.target.set(0, 0, 0);
      camera.position.set(0.28, 1.18, 4.35);
      camera.lookAt(controls.target);
      controls.update();
    }

    async function setExploded(next) {
      if (!clickReady || exploded === next) return;
      if (next) {
        const ready = await ensureExplodedParts();
        if (!ready) return;
      }

      exploded = next;
      assembledRoot.visible = !exploded;
      if (explodedRoot) explodedRoot.visible = exploded;
      modeChip.textContent = exploded ? "当前：拆解展示" : "当前：整体展示";
      toggleBtn.textContent = exploded ? "合体" : "拆解";
      if (smokeActive) rebuildSmokePath();

      if (!exploded) {
        showEmptyInfo();
      }
    }

    function animateExplodedParts() {
      if (!explodedRoot) return;
      explodedRoot.children.forEach((group) => {
        const target = exploded ? group.userData.target : group.userData.rest;
        group.position.lerp(target, 0.085);
      });
    }

    function handlePointerDown(event) {
      clickStart.set(event.clientX, event.clientY);
    }

    async function handlePointerUp(event) {
      const distance = clickStart.distanceTo(new THREE.Vector2(event.clientX, event.clientY));
      if (!clickReady || distance > 6) return;

      if (!exploded) {
        await setExploded(true);
        return;
      }

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(pickTargets, false);
      if (hits.length) {
        selectPart(hits[0].object.userData.partId);
      }
    }

    function resize() {
      const width = viewer.clientWidth;
      const height = viewer.clientHeight;
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      animateExplodedParts();
      updateSmokeFlow();
      renderer.render(scene, camera);
    }

    function start() {
      buildPartButtons();

      if (!window.CHANGXIN_GLB_BASE64) {
        loaderText.textContent = "未找到 model-data.js，请确认文件与 HTML 在同一文件夹";
        return;
      }

      try {
        const buffer = decodeBase64ToArrayBuffer(window.CHANGXIN_GLB_BASE64);
        const loader = new THREE.GLTFLoader();
        loader.parse(
          buffer,
          "",
          prepareModel,
          (error) => {
            console.error(error);
            loaderText.textContent = "模型解析失败，请检查 GLB 文件是否完整";
          }
        );
      } catch (error) {
        console.error(error);
        loaderText.textContent = "模型读取失败，请使用现代浏览器打开";
      }
    }

    renderer.domElement.addEventListener("pointerdown", handlePointerDown);
    renderer.domElement.addEventListener("pointerup", handlePointerUp);
    window.addEventListener("resize", resize);

    toggleBtn.addEventListener("click", () => setExploded(!exploded));
    smokeBtn.addEventListener("click", () => setSmokeActive(!smokeActive));
    resetBtn.addEventListener("click", async () => {
      await setExploded(false);
      fitCameraToModel();
    });

    resize();
    animate();
    start();
  </script>
</body>
</html>
